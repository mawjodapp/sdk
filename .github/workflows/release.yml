name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm -r publish --access public --no-git-checks
      # Packuments from one publish run can fan out minutes apart, so a consumer installing right
      # after a green run can see half the pair. Wait until both are visible; the publish line is
      # not the evidence, the packument is.
      - name: Wait for versions to be visible on the registry
        run: |
          version=$(node -p "require('./packages/api/package.json').version")
          for pkg in api nuxt; do
            for i in $(seq 1 60); do
              if curl -sf "https://registry.npmjs.org/@mawjod%2F$pkg" | grep -q "\"$version\":{\"name\""; then
                echo "@mawjod/$pkg@$version is visible on the registry"
                continue 2
              fi
              sleep 10
            done
            echo "@mawjod/$pkg@$version is not visible on the registry after 10 minutes." >&2
            echo "That is likely propagation skew rather than a lost publish: check the packument" >&2
            echo "before republishing, since the version may appear on its own." >&2
            exit 1
          done
