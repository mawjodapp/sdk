name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm -r publish --access public --no-git-checks
      # Packuments from one publish run can fan out minutes apart, so a consumer installing right
      # after a green run can see half the pair. Report visibility, but never fail on it: five
      # releases in a row went red here while `npm view` was already serving the version, and a
      # red run invites the one action that actually hurts — a republish. The publish step above
      # is the failure signal; this one only says when the pair became installable.
      - name: Report registry visibility
        run: |
          version=$(node -p "require('./packages/api/package.json').version")
          for pkg in api nuxt; do
            for i in $(seq 1 30); do
              if npm view "@mawjod/$pkg@$version" version >/dev/null 2>&1; then
                echo "@mawjod/$pkg@$version is visible on the registry"
                continue 2
              fi
              sleep 20
            done
            echo "::warning::@mawjod/$pkg@$version not visible after 10 minutes — propagation skew." \
              "Check 'npm view @mawjod/$pkg@$version' before concluding anything; do not republish."
          done
